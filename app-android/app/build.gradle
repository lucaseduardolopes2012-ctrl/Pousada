plugins { id "com.android.application" }
// Firebase (avisos no celular): só liga quando app/google-services.json existir
if (file("google-services.json").exists()) apply plugin: "com.google.gms.google-services"

// A chave de assinatura fica FORA do git: app-android/assinatura.properties (veja LEIA-ME.md)
def assin = new Properties()
def arqAssin = rootProject.file("assinatura.properties")
if (arqAssin.exists()) arqAssin.withInputStream { assin.load(it) }

android {
    namespace "app.pousada.painel"
    compileSdk 34
    defaultConfig {
        applicationId "app.pousada.painel"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        release {
            if (arqAssin.exists()) {
                storeFile rootProject.file(assin["arquivo"])
                storePassword assin["senha"]
                keyAlias assin["apelido"]
                keyPassword assin["senha"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (arqAssin.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-messaging"
}
