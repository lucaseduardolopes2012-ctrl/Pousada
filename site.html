<!doctype html>
<!-- Site público de cada pousada (site.html?p=<slug>), refeito com o kit da skill design-taste-frontend.
     Plano: place · paleta warm-paper-walnut (papel quente e nogueira, como madeira, pedra e lençol de pousada) · source-serif ·
     herói place (a foto da pousada; sem foto, o nome sobre a faixa da marca) · nav sem painel (fotos só as da pousada) ·
     footer-columns · ritmo space · botões arrow · marca stack · momento picture-develops na foto da seção de quartos ·
     página curta (menos de 8 fotos) ou compacta, conforme as fotos que a pousada enviou. Sem fotos de banco de imagens. -->
<html lang="pt-BR" data-type="place" data-radius="soft" data-buttons="arrow" data-motion>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pousada: quartos e pedido de reserva</title>
<meta name="description" content="Veja os quartos, as diárias e peça sua reserva direto com a pousada.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pousada: quartos e pedido de reserva">
<meta property="og:description" content="Veja os quartos, as diárias e peça sua reserva direto com a pousada.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f7f3ec">
<meta name="site-kind" content="other">
<meta name="page-type" content="place">
<meta name="page-kind" content="place">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..600&family=Libre+Franklin:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="assets/layout/layout.css">
<style>
:root {
  --p-bg: #f7f3ec; --p-surface: #ede6da; --p-ink: #2a2622; --p-muted: #665e55;
  --p-accent: #7a4a2c; --p-accent-ink: #ffffff; --p-action: #7a4a2c; --p-action-ink: #ffffff;
  --p-inv-bg: #2a2622; --p-inv-surface: #36322e; --p-inv-ink: #f7f3ec; --p-inv-muted: #a29e98;
  --p-inv-accent: #f7f3ec; --p-inv-accent-ink: #2a2622; --p-inv-action: #f7f3ec; --p-inv-action-ink: #2a2622;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-text: "Libre Franklin", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.02em;
}
/* CSS da página: só o que o kit não traz (o pedido em etapas e o aviso) */
.carregando { min-height: 100svh; display: grid; place-items: center; color: var(--p-muted); }
.pedido-form .datas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); align-items: end; }
.pedido-form .noites { min-height: 1.5em; }
.rows__name small { display: block; }
.livres { margin-top: var(--s-6); }
.livres .rows label { cursor: pointer; display: flex; align-items: flex-start; gap: var(--s-3); }
.livres .rows input { accent-color: var(--p-accent); width: 18px; height: 18px; margin-top: 4px; }
.livres .rows li.fora { opacity: .55; }
.dados-hospede { margin-top: var(--s-6); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.dados-hospede .todo { grid-column: 1 / -1; }
@media (max-width: 639px) { .dados-hospede { grid-template-columns: 1fr; } }
.feito .codigo { font-family: var(--font-display); font-size: clamp(48px, 7vw, 80px); line-height: 1; color: var(--p-accent); font-variant-numeric: tabular-nums lining-nums; }
.recado { position: fixed; z-index: 90; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--p-inv-bg); color: var(--p-inv-ink); padding: 12px 18px; border-radius: 8px; }
</style>
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
</head>
<body>
<p class="carregando">Abrindo a pousada…</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, esc, brl, hoje, addDias, noites, dmy, errText } = PG;
  const $ = id => document.getElementById(id);
  const slug = new URLSearchParams(location.search).get("p") || "";
  const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const dia = d => { const t = new Date(d + "T12:00:00Z"); return `${SEM[t.getUTCDay()]}, ${t.getUTCDate()} de ${MES[t.getUTCMonth()]}`; };
  const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  const ACESSO = { estrada: "De carro ou ônibus", barco: "Só de barco", ambos: "Pela estrada ou de barco" };
  const seta = '<svg class="m-arrow" viewBox="0 0 12 12" aria-hidden="true"><path class="m-arrow__stem" d="M1 6h8"/><path class="m-arrow__head" d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';

  function aviso(titulo, texto) {
    document.title = titulo;
    document.body.innerHTML = `<main><section class="section" style="--h: 1"><div class="wrap"><div class="section-head"><h1>${titulo}</h1><p>${texto}</p></div></div></section></main>`;
  }
  if (!/^[a-z0-9-]{3,40}$/.test(slug)) return aviso("Endereço incompleto", "O link da pousada precisa terminar com ?p= e o nome dela. Peça o link certo para a pousada.");
  const { data: P, error: eP } = await sb.rpc("site_pousada", { p_slug: slug });
  if (eP) return aviso("Não deu para abrir a pousada", errText(eP) + " Recarregue a página.");
  if (!P) return aviso("Pousada não encontrada", "Esse link não leva a nenhuma pousada. Confira se ele foi copiado inteiro.");

  const Q = (P.quartos || []).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true }));
  const F = (P.fotos || []).filter(u => /^https:\/\//.test(u));
  const lugar = [P.bairro, P.cidade].filter(Boolean).join(", ");
  const zap = (() => { let d = String(P.whatsapp || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d.length >= 12 ? d : ""; })();
  const linkZap = msg => `https://wa.me/${zap}?text=${encodeURIComponent(msg)}`;
  const precos = Q.map(q => Number(q.diaria) || 0).filter(v => v > 0), precoMin = precos.length ? Math.min(...precos) : 0;
  const titulo = `${P.nome}${P.cidade ? `, pousada em ${P.cidade}` : ""}`;
  document.title = `${titulo}: quartos e pedido de reserva`;
  const desc = P.descricao ? P.descricao.slice(0, 150) : `${plural(Q.length, "quarto", "quartos")}${lugar ? " em " + lugar : ""}. Veja o que está livre e peça sua reserva.`;
  document.querySelector('meta[name="description"]').content = desc;
  document.querySelector('meta[property="og:title"]').content = document.title;
  document.querySelector('meta[property="og:description"]').content = desc;
  document.documentElement.dataset.pageMode = F.length >= 8 ? "compact" : "short";

  const S = { entrada: hoje(), saida: addDias(hoje(), 1), adultos: 2, criancas: 0, livres: null, quarto: null, enviado: null };
  const fato = [precoMin ? `Diárias a partir de ${brl(precoMin)}` : "", `entrada a partir das ${P.checkin_hora}`].filter(Boolean).join(", ") + ".";
  const lead = `${P.descricao || `${plural(Q.length, "quarto", "quartos")}${lugar ? " em " + lugar : ""}.`} ${fato}`;
  const acao = `<div class="btn-row"><a class="btn btn--primary" href="#reserva">Ver quartos livres${seta}</a></div>`;

  /* herói: a foto da pousada; sem foto, o nome sobre a faixa da marca */
  const heroi = F.length
    ? `<section class="hero hero--place" data-enter aria-labelledby="hero-h">
        <img class="hero__bg" data-phone-fill src="${esc(F[0])}" alt="Foto da ${esc(P.nome)}" style="--ly-pos: 50% 50%" fetchpriority="high">
        <div class="wrap"><div class="hero-text"><div class="hero__text"><h1 id="hero-h">${esc(titulo)}</h1><p class="hero__lead">${esc(lead)}</p>${acao}</div></div></div></section>`
    : `<section class="hero hero--statement ground-brand" data-enter aria-labelledby="hero-h"><div class="wrap"><div class="hero__text"><h1 id="hero-h">${esc(titulo)}</h1><p class="hero__lead">${esc(lead)}</p>${acao}</div></div></section>`;

  const reserva = `<div class="closing__cta" id="reserva" aria-labelledby="reserva-h"><div class="section-head"><h2 id="reserva-h">Pedir reserva</h2><p>Você não paga nada agora. A pousada confirma ${zap ? "pelo WhatsApp" : "pelo telefone"}.</p></div><div id="pedido"></div></div>`;

  const rowsVisita = [
    P.acesso ? ["Acesso", ACESSO[P.acesso]] : null,
    P.como_chegar ? ["Como chegar", P.como_chegar] : null,
    (P.pagamentos || []).length ? ["Pagamento", P.pagamentos.join(", ") + (P.sinal_percentual ? `. Sinal de ${P.sinal_percentual}% para confirmar` : "")] : null,
    P.politica ? ["Cancelamento", P.politica] : null,
  ].filter(Boolean);
  const visita = `<div class="visit" id="como-chegar">
        <div class="visit__cols">
          <div class="visit__col stack-4">${lugar ? `<address class="visit__address">${esc(P.bairro || "")}${P.bairro && P.cidade ? "<br>" : ""}${esc(P.cidade || "")}</address>` : ""}
            ${P.bairro && P.cidade ? `<a class="link" href="https://www.openstreetmap.org/search?query=${encodeURIComponent(lugar)}" target="_blank" rel="noopener">Ver a região no mapa</a>` : ""}</div>
          <div class="visit__col"><dl class="hours"><dt>Entrada</dt><dd>a partir das ${esc(P.checkin_hora)}</dd><dt>Saída</dt><dd>até as ${esc(P.checkout_hora)}</dd></dl></div>
        </div>
        ${rowsVisita.length ? `<ul class="visit__rows">${rowsVisita.map(([k, v]) => `<li><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join("")}</ul>` : ""}
      </div>`;

  /* quartos e diárias, com a segunda foto da pousada (ou a de um quarto) */
  const fotoQ = F[1] || (Q.find(q => /^https:\/\//.test(q.foto_url || "")) || {}).foto_url || "";
  const quartos = `<section class="section" id="quartos" aria-labelledby="quartos-h" style="--h: 1; --hm: 3">
      <div class="wrap grid grid--top">
        <div class="${fotoQ ? "span-6" : "span-8"}">
          <div class="section-head"><h2 id="quartos-h">Quartos, diárias e como chegar</h2><p>Preço por noite. O total aparece quando você escolhe as datas.</p></div>
          ${Q.length ? `<ul class="rows">${Q.map(q => `<li><span class="rows__name">${esc(q.nome)}<small>${esc(q.tipo || "Quarto")}, até ${plural(q.capacidade, "pessoa", "pessoas")}</small></span><span class="rows__value">${brl(q.diaria)}</span></li>`).join("")}</ul>` : `<p>A pousada ainda não cadastrou os quartos.${zap ? " Fale com ela pelo WhatsApp." : ""}</p>`}
        </div>
        <div class="${fotoQ ? "span-6" : "span-4"} stack-6">${fotoQ ? `<figure class="pl-photo" style="--pl-r: 1.6" data-moment="picture-develops"><img src="${esc(fotoQ)}" alt="Foto da ${esc(P.nome)}" loading="lazy"></figure>` : ""}${visita}</div>
      </div></section>`;

  const contatos = [zap ? `<li><a href="${linkZap(`Olá! Vi o site da ${P.nome}.`)}" target="_blank" rel="noopener">WhatsApp</a></li>` : "", P.instagram ? `<li><a href="https://instagram.com/${esc(P.instagram)}" target="_blank" rel="noopener">Instagram</a></li>` : "", P.email ? `<li><a href="mailto:${esc(P.email)}">Email</a></li>` : ""].join("");
  const rodape = `<footer class="footer closing" id="contato" aria-label="Pedido de reserva e contato"><div class="wrap">
      ${reserva}
      <div class="closing__links"><div class="grid">
        <div class="span-4 stack-4"><a class="nav__logo" href="#topo"><span class="mark" data-mark="stack" aria-hidden="true"></span>${esc(P.nome)}</a><p class="footer__lede">${esc(lugar || "Pousada")}</p></div>
        <div class="span-2 footer__col"><h3>Quartos</h3><ul><li><a href="#quartos">Diárias</a></li><li><a href="#reserva">Pedir reserva</a></li></ul></div>
        <div class="span-2 footer__col"><h3>Visita</h3><ul><li><a href="#como-chegar">Como chegar</a></li><li><a href="#como-chegar">Horários</a></li></ul></div>
        ${contatos ? `<div class="span-2 footer__col"><h3>Contato</h3><ul>${contatos}</ul></div>` : ""}
      </div><div class="footer__legal"><span>${esc(P.nome)} &nbsp; <a href="privacidade.html?p=${encodeURIComponent(slug)}">Aviso de Privacidade</a></span></div></div>
    </div></footer>`;

  document.body.innerHTML = `<a class="skip" href="#principal">Pular para o conteúdo</a>
    <header class="nav" id="topo"><div class="wrap nav__bar">
      <a class="nav__logo" href="#topo"><span class="mark" data-mark="stack" aria-hidden="true"></span>${esc(P.nome)}</a>
      <nav class="nav__links" aria-label="Principal"><div class="nav__item"><a class="nav__link" href="#quartos">Quartos</a></div><div class="nav__item"><a class="nav__link" href="#como-chegar">Como chegar</a></div></nav>
      <div class="nav__actions"><a class="btn btn--primary" href="#reserva">Pedir reserva</a></div>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu"><span></span><span></span></button>
    </div></header>
    <main id="principal">${heroi}${quartos}</main>${rodape}
    <nav class="actionbar" aria-label="Ações rápidas"><a class="btn btn--primary" href="#reserva">Pedir reserva</a></nav>`;

  /* pedido em etapas: datas, quarto livre, dados do hóspede */
  const pessoas = () => S.adultos + S.criancas;
  function desenhaPedido() {
    const box = $("pedido");
    if (S.enviado) {
      const r = S.enviado, q = Q.find(x => x.id === r.quarto);
      const msg = `Olá! Mandei o pedido ${r.cod} pelo site: ${q.nome}, de ${dmy(r.entrada)} a ${dmy(r.saida)}, ${plural(r.pessoas, "pessoa", "pessoas")}. Nome: ${r.nome}.`;
      box.innerHTML = `<div class="feito stack-4" tabindex="-1" id="feito"><p class="codigo">${esc(r.cod)}</p>
        <p>A ${esc(P.nome)} recebeu seu pedido para o ${esc(q.nome)}, de ${dia(r.entrada)} a ${dia(r.saida)}. A reserva só vale depois que a pousada confirmar. Guarde esse número.</p>
        <div class="btn-row">${zap ? `<a class="btn btn--primary" href="${linkZap(msg)}" target="_blank" rel="noopener">Avisar a pousada no WhatsApp${seta}</a>` : ""}<button class="btn btn--secondary" type="button" id="outro">Fazer outro pedido</button></div></div>`;
      $("outro").onclick = () => { S.enviado = null; S.livres = null; S.quarto = null; desenhaPedido(); };
      $("feito").focus(); return;
    }
    const n = S.saida > S.entrada ? noites(S.entrada, S.saida) : 0;
    const lista = S.livres ? Q.map(q => { const l = S.livres.get(q.id); return { q, l, pode: !!l && q.capacidade >= pessoas() }; }) : [];
    const algum = lista.some(x => x.pode);
    box.innerHTML = `<form class="form pedido-form" id="f-datas" novalidate>
        <div class="datas">
          <div class="field"><label for="b-in">Entrada</label><input id="b-in" type="date" min="${hoje()}" value="${S.entrada}" required></div>
          <div class="field"><label for="b-out">Saída</label><input id="b-out" type="date" min="${addDias(S.entrada, 1)}" value="${S.saida}" required></div>
          <div class="field"><label for="b-ad">Adultos</label><input id="b-ad" type="number" min="1" max="20" inputmode="numeric" value="${S.adultos}"></div>
          <div class="field"><label for="b-cr">Crianças</label><input id="b-cr" type="number" min="0" max="20" inputmode="numeric" value="${S.criancas}"></div>
        </div>
        <p class="t-small muted noites" aria-live="polite">${n ? `${plural(n, "noite", "noites")}, de ${dia(S.entrada)} a ${dia(S.saida)}` : ""}</p>
        <p class="field__error" id="b-erro" role="alert" hidden></p>
        <div class="btn-row"><button class="btn btn--primary" type="submit" id="b-ver">Ver quartos livres</button></div>
      </form>
      ${S.livres ? `<div class="livres"><p class="t-label">${algum ? `Livres para ${plural(pessoas(), "pessoa", "pessoas")}, ${plural(n, "noite", "noites")}` : `Nenhum quarto livre para ${plural(pessoas(), "pessoa", "pessoas")} nessas datas. Tente outras datas${zap ? " ou fale com a pousada pelo WhatsApp" : ""}.`}</p>
        <ul class="rows" aria-label="Escolha o quarto">${lista.map(({ q, l, pode }) => `<li class="${pode ? "" : "fora"}"><label class="rows__name"><input type="radio" name="quarto" value="${esc(q.id)}" ${pode ? "" : "disabled"} ${S.quarto === q.id ? "checked" : ""}><span>${esc(q.nome)}<small>${pode ? `${esc(q.tipo || "Quarto")}, até ${plural(q.capacidade, "pessoa", "pessoas")}` : l ? `Cabem até ${q.capacidade}` : "Ocupado nessas datas"}</small></span></label><span class="rows__value">${pode ? brl(l.total) : `${brl(q.diaria)} a noite`}</span></li>`).join("")}</ul></div>` : ""}
      ${S.quarto ? `<form class="form dados-hospede" id="f-ficha" novalidate>
        <div class="field todo"><label for="f-nome">Nome completo</label><input id="f-nome" maxlength="100" autocomplete="name" required></div>
        <div class="field"><label for="f-tel">WhatsApp com DDD</label><input id="f-tel" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" required></div>
        <div class="field"><label for="f-doc">CPF ou documento (opcional)</label><input id="f-doc" maxlength="30" inputmode="numeric" autocomplete="off"></div>
        <div class="field todo"><label for="f-email">Email (opcional)</label><input id="f-email" type="email" inputmode="email" maxlength="120" autocomplete="email"></div>
        <div class="field todo"><label for="f-obs">Recado para a pousada (opcional: horário de chegada, se vem de barco)</label><textarea id="f-obs" maxlength="500" rows="3"></textarea></div>
        <p class="field__error todo" id="f-erro" role="alert" hidden></p>
        <div class="btn-row todo"><button class="btn btn--primary" type="submit" id="f-enviar">Enviar pedido${seta}</button></div>
        <p class="t-small muted todo">Ao enviar, você confirma que tem 18 anos ou mais e que leu o <a class="link" href="privacidade.html?p=${encodeURIComponent(slug)}" target="_blank" rel="noopener">Aviso de Privacidade</a>.${P.sinal_percentual ? ` A pousada pede sinal de ${P.sinal_percentual}% para confirmar.` : ""}</p>
      </form>` : ""}`;
    liga();
  }
  function liga() {
    const limpa = () => { S.livres = null; S.quarto = null; desenhaPedido(); };
    $("b-in").onchange = e => { S.entrada = e.target.value; if (!S.saida || S.saida <= S.entrada) S.saida = addDias(S.entrada, 1); limpa(); };
    $("b-out").onchange = e => { S.saida = e.target.value; limpa(); };
    $("b-ad").onchange = e => { S.adultos = Math.max(1, Math.min(20, Number(e.target.value) || 1)); if (S.livres) limpa(); };
    $("b-cr").onchange = e => { S.criancas = Math.max(0, Math.min(20, Number(e.target.value) || 0)); if (S.livres) limpa(); };
    $("f-datas").onsubmit = async e => {
      e.preventDefault(); const err = $("b-erro"); err.hidden = true;
      S.adultos = Math.max(1, Number($("b-ad").value) || 1); S.criancas = Math.max(0, Number($("b-cr").value) || 0);
      const falha = !S.entrada || !S.saida ? "Escolha a data de entrada e a de saída." : S.entrada < hoje() ? "A entrada precisa ser a partir de hoje." : S.saida <= S.entrada ? "A saída precisa ser depois da entrada." : noites(S.entrada, S.saida) > 60 ? "Dá para pedir até 60 noites por vez." : "";
      if (falha) { err.textContent = falha; err.hidden = false; return; }
      const btn = $("b-ver"); btn.disabled = true; btn.textContent = "Procurando quartos livres…";
      const { data, error } = await sb.rpc("quartos_disponiveis", { p_slug: slug, p_entrada: S.entrada, p_saida: S.saida });
      if (error) { btn.disabled = false; btn.textContent = "Ver quartos livres"; err.textContent = errText(error); err.hidden = false; return; }
      S.livres = new Map((data || []).map(r => [r.id, r])); S.quarto = null; desenhaPedido();
    };
    document.querySelectorAll('input[name="quarto"]').forEach(r => r.onchange = () => { S.quarto = r.value; desenhaPedido(); const f = $("f-nome"); if (f) f.focus(); });
    const ficha = $("f-ficha"); if (!ficha) return;
    ficha.onsubmit = async e => {
      e.preventDefault(); const err = $("f-erro"); err.hidden = true;
      const q = Q.find(x => x.id === S.quarto);
      const d = { nome: $("f-nome").value.trim(), tel: $("f-tel").value.trim(), doc: $("f-doc").value.trim(), email: $("f-email").value.trim(), obs: $("f-obs").value.trim() };
      const dig = d.tel.replace(/\D/g, "");
      const falha = d.nome.length < 2 ? "Escreva seu nome completo." : dig.length < 10 || dig.length > 13 ? "Coloque o WhatsApp com DDD, com 10 ou 11 números." : d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email) ? "Esse email não parece completo. Confira ou deixe em branco." : "";
      if (falha) { err.textContent = falha; err.hidden = false; return; }
      const btn = $("f-enviar"); btn.disabled = true; btn.textContent = "Enviando pedido…";
      const { data, error } = await sb.rpc("pedir_estadia", { p_slug: slug, p_quarto: q.id, p_entrada: S.entrada, p_saida: S.saida, p_adultos: S.adultos, p_criancas: S.criancas, p_nome: d.nome, p_telefone: d.tel, p_documento: d.doc, p_email: d.email, p_obs: d.obs });
      if (error) { btn.disabled = false; btn.textContent = "Enviar pedido"; err.textContent = errText(error); err.hidden = false; return; }
      S.enviado = { cod: "#" + String(data).padStart(5, "0"), quarto: q.id, entrada: S.entrada, saida: S.saida, pessoas: pessoas(), nome: d.nome };
      desenhaPedido();
    };
  }
  desenhaPedido();

  // o kit liga menu, botões, entrada do herói e o momento depois que a página existe
  for (const m of ["assets/system.js", "assets/motion/motion.js", "assets/layout/layout.js"]) await import(new URL(m, location.href).href);
  if (location.hash) { const alvo = document.querySelector(location.hash); if (alvo) alvo.scrollIntoView(); }
})();
</script>
</body>
</html>
