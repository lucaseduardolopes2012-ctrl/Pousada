<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pousada</title>
<meta name="description" content="Veja os quartos e peça sua reserva.">
<meta name="theme-color" content="#0e3a47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* Site público da pousada. Paleta do dono: dourado (fundo, 60%), azul-petróleo (barra, bilhete, cartões e faixa da ficha, 30%), névoa (só ação e seleção, 10%).
   A peça marcante é a busca de datas em forma de bilhete de barco; o resto fica quieto e alinhado à esquerda. */
:root { --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif; --sobre-preto: rgba(14, 58, 71, .76); --fio: rgba(14, 58, 71, .2); }
body { font-size: 15px; line-height: 1.55; }
.dentro { width: min(1160px, 100% - 40px); margin-inline: auto; }
@media (max-width: 560px) { .dentro { width: calc(100% - 32px); } }
a { text-underline-offset: 3px; }

/* topo */
.topo { position: sticky; top: 0; z-index: 40; background: var(--azul); color: var(--nevoa); padding-top: env(safe-area-inset-top, 0px); }
.topo .dentro { display: flex; align-items: center; gap: 18px; height: 62px; }
.topo .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 15px; min-width: 0; }
.topo .marca i { width: 30px; height: 30px; border-radius: 8px; background: var(--dourado); color: var(--azul); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 12px; flex: none; }
.topo .marca span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo nav { margin-left: auto; display: flex; align-items: center; gap: 22px; }
.topo nav a.l { color: rgba(238, 243, 243, .72); text-decoration: none; font-weight: 500; font-size: 14px; }
.topo nav a.l:hover { color: var(--nevoa); }
@media (max-width: 640px) { .topo nav a.l { display: none; } }

/* abertura */
.abertura { padding: clamp(36px, 7vw, 84px) 0 clamp(44px, 7vw, 88px); }
.abertura .dentro { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: clamp(28px, 5vw, 72px); align-items: end; }
@media (max-width: 920px) { .abertura .dentro { grid-template-columns: 1fr; align-items: start; } }
.onde { display: flex; align-items: center; gap: 7px; color: var(--sobre-preto); font-weight: 500; }
.onde svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; }
h1.nome { font-family: var(--display); font-weight: 750; font-variation-settings: "wdth" 78, "opsz" 96; font-size: clamp(54px, 10.5vw, 148px); line-height: .86; letter-spacing: -.035em; margin: 14px 0 22px; overflow-wrap: anywhere; text-wrap: balance; }
.sobre { max-width: 34em; color: var(--sobre-preto); font-size: 17px; }
.fatos { display: flex; flex-wrap: wrap; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--fio); }
.fatos div { padding: 14px 26px 0 0; margin-right: 26px; border-right: 1px solid var(--fio); }
.fatos div:last-child { border-right: 0; margin-right: 0; }
.fatos dt { color: var(--sobre-preto); font-size: 13px; }
.fatos dd { margin: 2px 0 0; font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.contato { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.btn--claro { background: transparent; color: var(--azul); border-color: rgba(14, 58, 71, .4); }
.btn--claro:hover { border-color: var(--azul); }

/* o bilhete */
.bilhete { position: relative; background: var(--azul); color: var(--nevoa); box-shadow: 0 30px 50px -30px rgba(14, 58, 71, .8); border-radius: 22px; --furo: 15px; }
.bilhete::before, .bilhete::after { content: ""; position: absolute; top: var(--corte); width: calc(var(--furo) * 2); height: calc(var(--furo) * 2); border-radius: 50%; background: var(--dourado); transform: translateY(-50%); }
.bilhete::before { left: calc(var(--furo) * -1); }
.bilhete::after { right: calc(var(--furo) * -1); }
.bilhete .parte { padding: 22px 24px; }
.bilhete .parte + .parte { border-top: 2px dashed rgba(238, 243, 243, .25); }
.bilhete h2 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.bilhete .rota { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; margin-top: 16px; }
.bilhete .rota .barco { width: 30px; height: 38px; display: grid; place-items: center; color: var(--dourado); }
.bilhete .rota .barco svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.bilhete label { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--suave); min-width: 0; }
.bilhete input[type="date"] { font-family: var(--display); font-size: 17px; font-weight: 650; height: 46px; min-width: 0; }
@media (max-width: 420px) { .bilhete .parte { padding: 20px 18px; } .bilhete .rota { gap: 6px; } .bilhete .rota .barco { width: 20px; } .bilhete input[type="date"] { font-size: 14.5px; padding: 0 6px; } }
.bilhete .gente { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.contador { display: flex; align-items: center; justify-content: space-between; height: 46px; border: 1px solid var(--borda); border-radius: var(--r-p); padding: 0 5px; }
.contador button { width: 34px; height: 34px; border-radius: 8px; border: 0; background: var(--c30-clara); color: var(--nevoa); font-size: 18px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.contador button:disabled { opacity: .35; cursor: default; }
.contador output { font-family: var(--display); font-size: 19px; font-weight: 700; min-width: 2ch; text-align: center; }
.bilhete .noites { margin: 12px 0 0; font-size: 13.5px; color: var(--suave); min-height: 1.5em; }
.bilhete .btn--cheio { width: 100%; height: 48px; font-size: 15px; margin-top: 14px; }

/* quartos */
.secao { padding: clamp(44px, 6vw, 80px) 0; border-top: 1px solid var(--fio); }
.secao-cab { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
h2.titulo { font-family: var(--display); font-variation-settings: "wdth" 80, "opsz" 72; font-size: clamp(34px, 5vw, 56px); line-height: .95; font-weight: 750; letter-spacing: -.03em; }
.secao-cab p { color: var(--sobre-preto); max-width: 32em; }
.grade-q { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.q { background: var(--azul); color: var(--nevoa); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; border: 2px solid transparent; }
.q.escolhido { border-color: var(--nevoa); box-shadow: 0 0 0 4px rgba(14, 58, 71, .35); }
.q.fora { opacity: .6; }
.q .f { aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--c30-clara); position: relative; display: grid; place-items: center; }
.q .f img { width: 100%; height: 100%; object-fit: cover; }
.q .f .vazia { font-family: var(--display); font-variation-settings: "wdth" 78; font-weight: 750; font-size: 54px; color: var(--dourado); letter-spacing: -.03em; opacity: .85; padding: 0 12px; text-align: center; line-height: .9; overflow-wrap: anywhere; }
.q .f .situ { position: absolute; left: 10px; top: 10px; height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; background: rgba(5, 25, 31, .6); color: var(--nevoa); }
.q .f .situ.livre { background: var(--nevoa); color: var(--azul); }
.q .c { padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.q h3 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 23px; font-weight: 700; letter-spacing: -.015em; }
.q .tipo { color: var(--suave); font-size: 14px; }
.q .desc { color: var(--suave); font-size: 14px; margin-top: 4px; }
.q .pe { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: auto; padding-top: 16px; }
.q .preco b { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.q .preco span { color: var(--suave); font-size: 12.5px; }
.q .pe .btn { height: 40px; }
.q .pe .btn--borda { border-color: var(--borda); background: transparent; }

/* ficha: a faixa branca */
.ficha-faixa { background: var(--azul); color: var(--nevoa); padding: clamp(44px, 6vw, 80px) 0; }
.ficha-faixa h2.titulo { color: var(--nevoa); }
.ficha-faixa .secao-cab p { color: var(--suave); }
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; align-items: start; }
@media (max-width: 900px) { .ficha { grid-template-columns: 1fr; } }
.passos { list-style: none; margin: 0 0 22px; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; counter-reset: p; }
.passos li { counter-increment: p; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 6px; border-radius: 999px; background: var(--c30-clara); font-weight: 600; font-size: 13.5px; color: var(--suave); }
.passos li::before { content: counter(p); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--campo); font-size: 12px; font-weight: 700; color: var(--nevoa); }
.passos li.feito { background: rgba(240, 166, 49, .16); color: var(--dourado); }
.passos li.feito::before { background: var(--dourado); color: var(--azul); }
.passos li.agora { background: var(--nevoa); color: var(--azul); }
.passos li.agora::before { background: var(--azul); color: var(--nevoa); }
.ficha form { display: grid; gap: 18px; }
.ficha .campos label { display: block; font-size: 13.5px; font-weight: 600; color: var(--nevoa); }
.ficha .campos label small { margin-left: 4px; }
.ficha .campos label > input, .ficha .campos label > textarea { margin-top: 7px; }
.ficha input:not([type="checkbox"]), .ficha textarea { height: 48px; font-size: 16px; }
.ficha textarea { height: auto; min-height: 90px; }
.ficha .enviar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ficha .enviar .btn--cheio { height: 50px; padding: 0 26px; font-size: 15.5px; }
.ficha .enviar small { color: var(--suave); font-size: 13px; max-width: 30em; }
.resumo { position: sticky; top: 84px; border: 1px solid var(--borda); background: var(--campo); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
@media (max-width: 900px) { .resumo { position: static; order: -1; } }
.resumo h3 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 22px; font-weight: 700; }
.resumo dl { margin: 0; display: grid; gap: 10px; }
.resumo dl div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.resumo dt { color: var(--suave); }
.resumo dd { margin: 0; font-weight: 600; text-align: right; }
.resumo .total { border-top: 1px solid var(--borda); padding-top: 12px; }
.resumo .total dd { font-family: var(--display); font-size: 26px; font-weight: 750; }
.resumo .mudar { justify-self: start; background: none; border: 0; padding: 0; color: var(--dourado); font-weight: 700; cursor: pointer; font-size: 13.5px; text-decoration: underline; }
.resumo .aviso { font-size: 13px; color: var(--suave); background: var(--c30-clara); border-radius: 10px; padding: 10px 12px; }
.espera { padding: 22px; border-radius: 16px; background: var(--campo); color: var(--suave); max-width: 36em; }

.feito-ok { display: grid; gap: 14px; max-width: 40em; }
.feito-ok .cod { font-family: var(--display); font-variation-settings: "wdth" 78; font-size: clamp(48px, 9vw, 96px); font-weight: 750; letter-spacing: -.03em; line-height: .9; color: var(--dourado); }
.feito-ok p { color: var(--suave); font-size: 16px; }
@media (prefers-reduced-motion: no-preference) { .feito-ok { animation: aparece .35s ease-out; } @keyframes aparece { from { opacity: 0; transform: translateY(8px); } } }

/* bom saber */
.saber { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 1px solid var(--fio); }
.saber div { padding: 20px 24px 20px 0; border-bottom: 1px solid var(--fio); }
.saber dt { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.saber dd { margin: 0; color: var(--sobre-preto); white-space: pre-line; }
.rodape { padding: 30px 0 calc(30px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--fio); color: var(--sobre-preto); font-size: 13.5px; }
.rodape .dentro { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape a { color: var(--sobre-preto); }

.nao-achei { min-height: 70vh; display: grid; place-items: center; text-align: left; padding: 40px 20px; }
.nao-achei div { max-width: 30em; display: grid; gap: 14px; }
.nao-achei h1 { font-family: var(--display); font-size: 40px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
.nao-achei p { color: var(--sobre-preto); }
.carregando { min-height: 70vh; display: grid; place-items: center; color: var(--sobre-preto); }
.ficha .erro, .bilhete .erro { margin: 0; }
</style>
</head>
<body>
<div id="raiz"><p class="carregando">Carregando a pousada…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, esc, brl, hoje, addDias, noites, dmy, errText } = PG;
  const $ = id => document.getElementById(id);
  const raiz = $("raiz");
  const slug = new URLSearchParams(location.search).get("p") || "";
  const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const dia = d => { const t = new Date(d + "T12:00:00Z"); return `${SEM[t.getUTCDay()]}, ${t.getUTCDate()} de ${MES[t.getUTCMonth()]}`; };
  const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  const iniciais = s => String(s || "?").trim().split(/\s+/).filter(w => w.length > 2 || /^[A-Z]/.test(w)).slice(-2).map(w => w[0]).join("").toUpperCase() || "P";
  const ICONE_LOCAL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  const ICONE_BARCO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M5 14l-1-4h16l-2 4M12 10V4l5 6"/></svg>';
  const naoAchei = (t, p) => { raiz.innerHTML = `<main class="nao-achei"><div><h1>${t}</h1><p>${p}</p></div></main>`; document.title = t; };

  if (!/^[a-z0-9-]{3,40}$/.test(slug)) return naoAchei("Endereço incompleto", "O link da pousada precisa terminar com ?p= e o nome dela. Peça o link certo para a pousada.");
  const COLS = "id,slug,nome,cidade,bairro,descricao,whatsapp,email,instagram,checkin_hora,checkout_hora,acesso,como_chegar,pagamentos,sinal_percentual,politica";
  const { data: P, error: eP } = await sb.from("pousadas").select(COLS).eq("slug", slug).maybeSingle();
  if (eP) return naoAchei("Não deu para abrir a pousada", errText(eP) + " Recarregue a página.");
  if (!P) return naoAchei("Pousada não encontrada", "Esse link não leva a nenhuma pousada. Confira se ele foi copiado inteiro.");
  const { data: QS } = await sb.from("quartos").select("id,nome,tipo,capacidade,diaria,descricao,foto_url").eq("pousada_id", P.id).eq("ativo", true);
  const Q = (QS || []).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true }));

  const lugar = [P.bairro, P.cidade].filter(Boolean).join(", ");
  const zap = (() => { let d = String(P.whatsapp || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d.length >= 12 ? d : ""; })();
  const linkZap = msg => `https://wa.me/${zap}?text=${encodeURIComponent(msg)}`;
  document.title = `${P.nome}${P.cidade ? ", " + P.cidade : ""}`;
  document.querySelector('meta[name="description"]').content = P.descricao ? P.descricao.slice(0, 150) : `Quartos da ${P.nome}${lugar ? " em " + lugar : ""}. Veja os quartos livres e peça sua reserva.`;

  const S = { entrada: hoje(), saida: addDias(hoje(), 1), adultos: 2, criancas: 0, livres: null, buscando: false, quarto: null, enviado: null };
  const precoMin = Q.length ? Math.min(...Q.map(q => Number(q.diaria) || 0).filter(v => v > 0)) : 0;
  const ACESSO = { estrada: "De carro ou ônibus", barco: "Só de barco", ambos: "Pela estrada ou de barco" };

  /* ---------- página ---------- */
  raiz.innerHTML = `
  <header class="topo"><div class="dentro"><a class="marca" href="#inicio"><i>${esc(iniciais(P.nome))}</i><span>${esc(P.nome)}</span></a>
    <nav><a class="l" href="#quartos">Quartos</a>${P.como_chegar || P.politica || (P.pagamentos || []).length ? '<a class="l" href="#saber">Bom saber</a>' : ""}<a class="btn btn--cheio" href="#bilhete">Pedir reserva</a></nav></div></header>
  <main id="inicio">
    <section class="abertura"><div class="dentro">
      <div>
        ${lugar ? `<p class="onde">${ICONE_LOCAL}${esc(lugar)}</p>` : ""}
        <h1 class="nome">${esc(P.nome)}</h1>
        <p class="sobre">${esc(P.descricao || `${plural(Q.length, "quarto", "quartos")}${lugar ? " em " + lugar : ""}. Escolha as datas, veja o que está livre e mande seu pedido. A pousada confirma pelo WhatsApp.`)}</p>
        <dl class="fatos"><div><dt>Entrada a partir das</dt><dd>${esc(P.checkin_hora)}</dd></div><div><dt>Saída até as</dt><dd>${esc(P.checkout_hora)}</dd></div><div><dt>Quartos</dt><dd>${Q.length}</dd></div>${precoMin ? `<div><dt>Diárias a partir de</dt><dd>${brl(precoMin)}</dd></div>` : ""}</dl>
        ${zap || P.instagram ? `<div class="contato">${zap ? `<a class="btn btn--claro" href="${linkZap(`Olá! Vi o site da ${P.nome} e queria saber mais.`)}" target="_blank" rel="noopener">Falar no WhatsApp</a>` : ""}${P.instagram ? `<a class="btn btn--claro" href="https://instagram.com/${esc(P.instagram)}" target="_blank" rel="noopener">@${esc(P.instagram)}</a>` : ""}</div>` : ""}
      </div>
      <form class="bilhete" id="bilhete" novalidate aria-labelledby="b-titulo">
        <div class="parte"><h2 id="b-titulo">Quando você vem?</h2>
          <div class="rota"><label>Entrada<input type="date" id="b-in" min="${hoje()}" value="${S.entrada}" required></label><span class="barco">${ICONE_BARCO}</span><label>Saída<input type="date" id="b-out" min="${addDias(hoje(), 1)}" value="${S.saida}" required></label></div>
          <p class="noites" id="b-noites" aria-live="polite"></p></div>
        <div class="parte"><div class="gente">
          <label>Adultos<span class="contador"><button type="button" data-conta="adultos" data-d="-1" aria-label="Menos um adulto">−</button><output id="o-adultos">${S.adultos}</output><button type="button" data-conta="adultos" data-d="1" aria-label="Mais um adulto">+</button></span></label>
          <label>Crianças<span class="contador"><button type="button" data-conta="criancas" data-d="-1" aria-label="Menos uma criança">−</button><output id="o-criancas">${S.criancas}</output><button type="button" data-conta="criancas" data-d="1" aria-label="Mais uma criança">+</button></span></label></div>
          <p class="erro" id="b-erro" role="alert" hidden></p>
          <button class="btn btn--cheio" type="submit" id="b-ver">Ver quartos livres</button></div>
      </form>
    </div></section>

    <section class="secao" id="quartos"><div class="dentro">
      <div class="secao-cab"><h2 class="titulo">Quartos</h2><p id="q-legenda" aria-live="polite"></p></div>
      <div class="grade-q" id="grade-q"></div>
    </div></section>

    <section class="ficha-faixa" id="ficha"><div class="dentro" id="ficha-dentro"></div></section>

    ${saber()}
  </main>
  <footer class="rodape"><div class="dentro"><span>${esc(P.nome)}${lugar ? ", " + esc(lugar) : ""}</span>${P.email ? `<a href="mailto:${esc(P.email)}">${esc(P.email)}</a>` : ""}</div></footer>`;
  // o recorte do bilhete fica na linha pontilhada, onde quer que ela esteja
  const ajustaCorte = () => { const b = $("bilhete"), p = b.querySelector(".parte + .parte"); b.style.setProperty("--corte", `${p.offsetTop}px`); };
  ajustaCorte(); addEventListener("resize", ajustaCorte); document.fonts && document.fonts.ready.then(ajustaCorte);

  function saber() {
    const it = [];
    it.push(["Horários", `Entrada a partir das ${P.checkin_hora}.\nSaída até as ${P.checkout_hora}.`]);
    if (P.acesso || P.como_chegar) it.push(["Como chegar", [P.acesso && ACESSO[P.acesso], P.como_chegar].filter(Boolean).join(".\n")]);
    if ((P.pagamentos || []).length) it.push(["Pagamento", P.pagamentos.join(", ") + (P.sinal_percentual ? `.\nSinal de ${P.sinal_percentual}% para confirmar.` : ".")]);
    if (P.politica) it.push(["Cancelamento", P.politica]);
    return `<section class="secao" id="saber"><div class="dentro"><div class="secao-cab"><h2 class="titulo">Bom saber</h2></div><dl class="saber">${it.map(([t, v]) => `<div><dt>${esc(t)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div></section>`;
  }

  /* ---------- bilhete ---------- */
  const pessoas = () => S.adultos + S.criancas;
  function atualizaBilhete() {
    $("o-adultos").value = S.adultos; $("o-criancas").value = S.criancas;
    document.querySelectorAll("[data-conta]").forEach(b => { const v = S[b.dataset.conta] + Number(b.dataset.d); b.disabled = v < (b.dataset.conta === "adultos" ? 1 : 0) || v > 20; });
    const n = S.entrada && S.saida && S.saida > S.entrada ? noites(S.entrada, S.saida) : 0;
    $("b-noites").textContent = n ? `${plural(n, "noite", "noites")}, de ${dia(S.entrada)} a ${dia(S.saida)}` : "";
  }
  $("b-in").addEventListener("change", e => { S.entrada = e.target.value; if (!S.saida || S.saida <= S.entrada) { S.saida = addDias(S.entrada, 1); $("b-out").value = S.saida; } $("b-out").min = addDias(S.entrada, 1); limpaBusca(); });
  $("b-out").addEventListener("change", e => { S.saida = e.target.value; limpaBusca(); });
  document.addEventListener("click", e => { const b = e.target.closest("[data-conta]"); if (!b) return; S[b.dataset.conta] = Math.max(0, S[b.dataset.conta] + Number(b.dataset.d)); limpaBusca(); });
  function limpaBusca() { if (S.livres) { S.livres = null; S.quarto = null; desenhaQuartos(); desenhaFicha(); } atualizaBilhete(); }

  $("bilhete").addEventListener("submit", async e => {
    e.preventDefault(); const err = $("b-erro"); err.hidden = true;
    const falha = !S.entrada || !S.saida ? "Escolha a data de entrada e a de saída." : S.entrada < hoje() ? "A entrada precisa ser a partir de hoje." : S.saida <= S.entrada ? "A saída precisa ser depois da entrada." : noites(S.entrada, S.saida) > 60 ? "Dá para pedir até 60 noites por vez." : "";
    if (falha) { err.textContent = falha; err.hidden = false; return; }
    const btn = $("b-ver"); btn.disabled = true; btn.textContent = "Procurando quartos livres…";
    const { data, error } = await sb.rpc("quartos_disponiveis", { p_slug: slug, p_entrada: S.entrada, p_saida: S.saida });
    btn.disabled = false; btn.textContent = "Ver quartos livres";
    if (error) { err.textContent = errText(error); err.hidden = false; return; }
    S.livres = new Map((data || []).map(r => [r.id, r])); S.quarto = null;
    desenhaQuartos(); desenhaFicha();
    $("quartos").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  /* ---------- quartos ---------- */
  function desenhaQuartos() {
    const n = noites(S.entrada, S.saida);
    const leg = $("q-legenda");
    if (!Q.length) { leg.textContent = ""; $("grade-q").innerHTML = `<p class="espera" style="background:var(--azul);color:var(--nevoa)">A pousada ainda não cadastrou os quartos. ${zap ? "Fale com ela pelo WhatsApp." : ""}</p>`; return; }
    if (!S.livres) leg.textContent = "Escolha as datas no bilhete para ver o que está livre e quanto fica a estadia.";
    else { const ok = Q.filter(q => S.livres.has(q.id) && q.capacidade >= pessoas()).length; leg.textContent = ok ? `${plural(ok, "quarto livre", "quartos livres")} para ${plural(pessoas(), "pessoa", "pessoas")}, ${dia(S.entrada)} a ${dia(S.saida)}.` : `Nenhum quarto livre para ${plural(pessoas(), "pessoa", "pessoas")} nessas datas. Tente outras datas${zap ? " ou fale com a pousada pelo WhatsApp" : ""}.`; }
    $("grade-q").innerHTML = Q.map(q => {
      const livre = S.livres && S.livres.get(q.id), cabe = q.capacidade >= pessoas(), pode = livre && cabe;
      const situ = !S.livres ? "" : pode ? `<span class="situ livre">Livre</span>` : `<span class="situ">${livre ? `Cabem até ${q.capacidade}` : "Ocupado nessas datas"}</span>`;
      const preco = pode ? `<b>${brl(livre.total)}</b><span>${plural(n, "noite", "noites")}, ${brl(q.diaria)} cada</span>` : `<b>${brl(q.diaria)}</b><span>por noite</span>`;
      const acao = !S.livres ? `<a class="btn btn--borda" href="#bilhete" data-datas>Escolher datas</a>` : pode ? `<button class="btn ${S.quarto === q.id ? "btn--cheio" : "btn--borda"}" data-escolher="${esc(q.id)}" aria-pressed="${S.quarto === q.id}">${S.quarto === q.id ? "Quarto escolhido" : "Escolher este quarto"}</button>` : "";
      const nomeCurto = q.nome.replace(/^quarto\s*/i, "") || q.nome;
      return `<article class="q ${S.quarto === q.id ? "escolhido" : ""} ${S.livres && !pode ? "fora" : ""}"><div class="f">${q.foto_url ? `<img src="${esc(q.foto_url)}" alt="Foto do ${esc(q.nome)}" loading="lazy">` : `<span class="vazia" aria-hidden="true">${esc(nomeCurto.length <= 8 ? nomeCurto : q.nome)}</span>`}${situ}</div>
        <div class="c"><h3>${esc(q.nome)}</h3><p class="tipo">${esc(q.tipo || "Quarto")}, para até ${plural(q.capacidade, "pessoa", "pessoas")}</p>${q.descricao ? `<p class="desc">${esc(q.descricao)}</p>` : ""}
        <div class="pe"><span class="preco">${preco}</span>${acao}</div></div></article>`;
    }).join("");
  }
  document.addEventListener("click", e => {
    const d = e.target.closest("[data-datas]"); if (d) { e.preventDefault(); $("bilhete").scrollIntoView({ behavior: "smooth", block: "center" }); setTimeout(() => $("b-in").focus(), 350); return; }
    const b = e.target.closest("[data-escolher]"); if (!b) return;
    S.quarto = b.dataset.escolher; desenhaQuartos(); desenhaFicha();
    $("ficha").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    setTimeout(() => { const f = $("f-nome"); if (f) f.focus({ preventScroll: true }); }, 400);
  });

  /* ---------- ficha ---------- */
  function desenhaFicha() {
    const box = $("ficha-dentro");
    if (S.enviado) {
      const r = S.enviado, q = Q.find(x => x.id === r.quarto);
      const msg = `Olá! Mandei o pedido ${r.cod} pelo site: ${q.nome}, de ${dmy(r.entrada)} a ${dmy(r.saida)}, ${plural(r.pessoas, "pessoa", "pessoas")}. Nome: ${r.nome}.`;
      box.innerHTML = `<div class="feito-ok" tabindex="-1" id="ok"><h2 class="titulo">Pedido enviado</h2><span class="cod">${esc(r.cod)}</span>
        <p>A ${esc(P.nome)} recebeu seu pedido para o ${esc(q.nome)}, de ${dia(r.entrada)} a ${dia(r.saida)}. A reserva só vale depois que a pousada confirmar${zap ? " pelo WhatsApp" : ""}. Guarde esse número.</p>
        <div class="enviar" style="display:flex;gap:10px;flex-wrap:wrap">${zap ? `<a class="btn btn--cheio btn--grande" href="${linkZap(msg)}" target="_blank" rel="noopener">Avisar a pousada no WhatsApp</a>` : ""}<button class="btn btn--borda btn--grande" type="button" id="outro">Fazer outro pedido</button></div></div>`;
      $("outro").onclick = () => { S.enviado = null; S.livres = null; S.quarto = null; desenhaQuartos(); desenhaFicha(); $("bilhete").scrollIntoView({ behavior: "smooth" }); };
      $("ok").focus(); return;
    }
    const q = S.quarto && Q.find(x => x.id === S.quarto), livre = q && S.livres.get(q.id), n = noites(S.entrada, S.saida);
    const passo = !S.livres ? 1 : !q ? 2 : 3;
    const passos = `<ol class="passos" aria-label="Etapas do pedido">${["Datas", "Quarto", "Seus dados"].map((t, i) => `<li class="${i + 1 < passo ? "feito" : i + 1 === passo ? "agora" : ""}" ${i + 1 === passo ? 'aria-current="step"' : ""}>${t}</li>`).join("")}</ol>`;
    const cab = `<div class="secao-cab"><div><h2 class="titulo">Sua ficha</h2></div><p>Preencha uma vez e a pousada já recebe tudo. Quem estiver no balcão também pode preencher aqui na chegada.</p></div>`;
    if (!q) { box.innerHTML = cab + passos + `<p class="espera">${passo === 1 ? "Escolha as datas no bilhete lá em cima e toque em Ver quartos livres." : "Escolha um quarto livre na lista acima. A ficha abre aqui."}</p>`; return; }
    box.innerHTML = cab + passos + `<div class="ficha">
      <form id="f-ficha" novalidate><div class="campos">
        <label class="todo">Nome completo<input id="f-nome" maxlength="100" autocomplete="name" required></label>
        <label>WhatsApp com DDD<input id="f-tel" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="(41) 99999-0000" required></label>
        <label>CPF ou documento <small>opcional</small><input id="f-doc" maxlength="30" inputmode="numeric" autocomplete="off"></label>
        <label class="todo">Email <small>opcional</small><input id="f-email" type="email" inputmode="email" maxlength="120" autocomplete="email"></label>
        <label class="todo">Recado para a pousada <small>opcional: horário de chegada, se vem de barco, pedidos especiais</small><textarea id="f-obs" maxlength="500"></textarea></label></div>
        <p class="erro" id="f-erro" role="alert" hidden></p>
        <div class="enviar"><button class="btn btn--cheio" type="submit" id="f-enviar">Enviar pedido</button><small>Você ainda não paga nada. A pousada confirma ${zap ? "pelo WhatsApp" : "pelo telefone"}.</small></div>
      </form>
      <aside class="resumo" aria-label="Resumo do pedido"><h3>${esc(q.nome)}</h3>
        <dl><div><dt>Entrada</dt><dd>${dia(S.entrada)}, a partir das ${esc(P.checkin_hora)}</dd></div><div><dt>Saída</dt><dd>${dia(S.saida)}, até as ${esc(P.checkout_hora)}</dd></div>
        <div><dt>Pessoas</dt><dd>${plural(S.adultos, "adulto", "adultos")}${S.criancas ? ` e ${plural(S.criancas, "criança", "crianças")}` : ""}</dd></div>
        <div class="total"><dt>${plural(n, "noite", "noites")}</dt><dd>${brl(livre.total)}</dd></div></dl>
        ${P.sinal_percentual ? `<p class="aviso">A pousada pede sinal de ${P.sinal_percentual}% para confirmar.</p>` : ""}
        <button class="mudar" type="button" data-mudar>Trocar quarto ou datas</button></aside></div>`;
    document.querySelector("[data-mudar]").onclick = () => $("quartos").scrollIntoView({ behavior: "smooth" });
    $("f-ficha").addEventListener("input", () => { $("f-erro").hidden = true; });
    $("f-ficha").addEventListener("submit", async e => {
      e.preventDefault(); const err = $("f-erro"); err.hidden = true;
      const d = { nome: $("f-nome").value.trim(), tel: $("f-tel").value.trim(), doc: $("f-doc").value.trim(), email: $("f-email").value.trim(), obs: $("f-obs").value.trim() };
      const dig = d.tel.replace(/\D/g, "");
      const falha = d.nome.length < 2 ? "Escreva seu nome completo." : dig.length < 10 || dig.length > 13 ? "Coloque o WhatsApp com DDD, por exemplo (41) 99999-0000." : d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email) ? "Esse email não parece completo. Confira ou deixe em branco." : "";
      if (falha) { err.textContent = falha; err.hidden = false; return; }
      const btn = $("f-enviar"); btn.disabled = true; btn.textContent = "Enviando pedido…";
      const { data, error } = await sb.rpc("pedir_estadia", { p_slug: slug, p_quarto: q.id, p_entrada: S.entrada, p_saida: S.saida, p_adultos: S.adultos, p_criancas: S.criancas, p_nome: d.nome, p_telefone: d.tel, p_documento: d.doc, p_email: d.email, p_obs: d.obs });
      if (error) { btn.disabled = false; btn.textContent = "Enviar pedido"; err.textContent = errText(error); err.hidden = false; return; }
      S.enviado = { cod: "#" + String(data).padStart(5, "0"), quarto: q.id, entrada: S.entrada, saida: S.saida, pessoas: pessoas(), nome: d.nome };
      desenhaFicha();
    });
  }

  atualizaBilhete(); desenhaQuartos(); desenhaFicha();
  if (location.hash && location.hash !== "#inicio") { const alvo = document.querySelector(location.hash); if (alvo) alvo.scrollIntoView(); }
})();
</script>
</body>
</html>
