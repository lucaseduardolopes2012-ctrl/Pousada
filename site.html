<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pousada</title>
<meta name="description" content="Veja os quartos e peça sua reserva.">
<meta name="theme-color" content="#13294b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Federo&display=swap">
<link rel="icon" type="image/png" href="img/favicon-guara.png">
<link rel="stylesheet" href="app.css">
<style>
/* Site público da pousada. Paleta do dono: branco-gelo (fundo, 60%), azul-marinho (barra, bilhete, cartões e faixa da ficha, 30%), laranja (só ação e seleção, 10%).
   A peça marcante é a busca de datas em forma de bilhete de barco; o resto fica quieto e alinhado à esquerda. */
:root { --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif; --sobre-preto: rgba(19, 41, 75, .72); --fio: rgba(19, 41, 75, .14); }
body { font-size: 15px; line-height: 1.55; }
.dentro { width: min(1160px, 100% - 40px); margin-inline: auto; }
@media (max-width: 560px) { .dentro { width: calc(100% - 32px); } }
a { text-underline-offset: 3px; }

/* topo */
.topo { position: sticky; top: 0; z-index: 40; background: var(--azul); color: var(--nevoa); padding-top: env(safe-area-inset-top, 0px); }
.topo .dentro { display: flex; align-items: center; gap: 18px; height: 62px; }
.topo .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 15px; min-width: 0; }
.topo .marca i { width: 30px; height: 30px; border-radius: 8px; background: var(--dourado); color: var(--azul); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 12px; flex: none; }
.topo .marca span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo nav { margin-left: auto; display: flex; align-items: center; gap: 22px; }
.topo nav a.l { color: rgba(238, 243, 243, .72); text-decoration: none; font-weight: 500; font-size: 14px; }
.topo nav a.l:hover { color: var(--nevoa); }
@media (max-width: 640px) { .topo nav a.l { display: none; } }

/* abertura */
.abertura { padding: clamp(36px, 7vw, 84px) 0 clamp(44px, 7vw, 88px); }
.abertura .dentro { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: clamp(28px, 5vw, 72px); align-items: end; }
@media (max-width: 920px) { .abertura .dentro { grid-template-columns: 1fr; align-items: start; } }
.onde { display: flex; align-items: center; gap: 7px; color: var(--sobre-preto); font-weight: 500; }
.onde svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; }
h1.nome { color: var(--titulo, inherit); font-family: var(--display); font-weight: 750; font-variation-settings: "wdth" 78, "opsz" 96; font-size: clamp(54px, 10.5vw, 148px); line-height: .86; letter-spacing: -.035em; margin: 14px 0 22px; overflow-wrap: anywhere; text-wrap: balance; }
.sobre { max-width: 34em; color: var(--sobre-preto); font-size: 17px; }
.fatos { display: flex; flex-wrap: wrap; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--fio); }
.fatos div { padding: 14px 26px 0 0; margin-right: 26px; border-right: 1px solid var(--fio); }
.fatos div:last-child { border-right: 0; margin-right: 0; }
.fatos dt { color: var(--sobre-preto); font-size: 13px; }
.fatos dd { margin: 2px 0 0; font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.contato { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.btn--claro { background: transparent; color: var(--azul); border-color: var(--claro-borda, rgba(14, 58, 71, .4)); }
.btn--claro:hover { border-color: var(--azul); }

/* o bilhete */
.bilhete { position: relative; background: var(--azul); color: var(--nevoa); box-shadow: 0 30px 50px -30px var(--sombra-bilhete, rgba(19, 41, 75, .7)); border-radius: 22px; --furo: 15px; }
.bilhete::before, .bilhete::after { content: ""; position: absolute; top: var(--corte); width: calc(var(--furo) * 2); height: calc(var(--furo) * 2); border-radius: 50%; background: var(--c60); transform: translateY(-50%); }
.bilhete::before { left: calc(var(--furo) * -1); }
.bilhete::after { right: calc(var(--furo) * -1); }
.bilhete .parte { padding: 22px 24px; }
.bilhete .parte + .parte { border-top: 2px dashed rgba(238, 243, 243, .25); }
.bilhete h2 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.bilhete .rota { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; margin-top: 16px; }
.bilhete .rota .barco { width: 30px; height: 38px; display: grid; place-items: center; color: var(--dourado); }
.bilhete .rota .barco svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.bilhete label { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--c30-suave); min-width: 0; }
.bilhete input[type="date"] { font-family: var(--display); font-size: 17px; font-weight: 650; height: 46px; min-width: 0; }
@media (max-width: 420px) { .bilhete .parte { padding: 20px 18px; } .bilhete .rota { gap: 6px; } .bilhete .rota .barco { width: 20px; } .bilhete input[type="date"] { font-size: 14.5px; padding: 0 6px; } }
.bilhete .gente { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.contador { border-color: rgba(255, 255, 255, .25) !important; display: flex; align-items: center; justify-content: space-between; height: 46px; border: 1px solid var(--borda); border-radius: var(--r-p); padding: 0 5px; }
.contador button { width: 34px; height: 34px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .12); color: #ffffff; font-size: 18px; font-weight: 700; cursor: pointer; display: grid; place-items: center; }
.contador button:disabled { opacity: .35; cursor: default; }
.contador output { font-family: var(--display); font-size: 19px; font-weight: 700; min-width: 2ch; text-align: center; }
.bilhete .noites { margin: 12px 0 0; font-size: 13.5px; color: var(--c30-suave); min-height: 1.5em; }
.bilhete .btn--cheio { width: 100%; height: 48px; font-size: 15px; margin-top: 14px; }

/* quartos */
.secao { padding: clamp(44px, 6vw, 80px) 0; border-top: 1px solid var(--fio); }
.secao-cab { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
h2.titulo { font-family: var(--display); }
.secao h2.titulo { color: var(--titulo, inherit); }
h2.titulo { font-variation-settings: "wdth" 80, "opsz" 72; font-size: clamp(34px, 5vw, 56px); line-height: .95; font-weight: 750; letter-spacing: -.03em; }
.secao-cab p { color: var(--sobre-preto); max-width: 32em; }
.grade-q { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.q { background: var(--azul); color: var(--nevoa); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; border: 2px solid transparent; }
.q.escolhido { border-color: var(--escolhido, var(--laranja)); box-shadow: 0 0 0 4px var(--anel, rgba(255, 122, 26, .45)); }
.q.fora { opacity: .6; }
.q .f { aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--c30-clara); position: relative; display: grid; place-items: center; }
.q .f img { width: 100%; height: 100%; object-fit: cover; }
.q .f .vazia { font-family: var(--display); font-variation-settings: "wdth" 78; font-weight: 750; font-size: 54px; color: var(--vazia, var(--dourado)); letter-spacing: -.03em; opacity: .85; padding: 0 12px; text-align: center; line-height: .9; overflow-wrap: anywhere; }
.q .f .situ { position: absolute; left: 10px; top: 10px; height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; background: var(--situ-fundo, rgba(5, 25, 31, .6)); color: var(--nevoa); }
.q .f .situ.livre { background: var(--livre-fundo, var(--laranja)); color: var(--livre-tinta, var(--marinho)); }
.q .c { padding: 14px 8px 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.q h3 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 23px; font-weight: 700; letter-spacing: -.015em; }
.q .tipo { color: var(--c30-suave); font-size: 14px; }
.q .desc { color: var(--c30-suave); font-size: 14px; margin-top: 4px; }
.q .pe { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin-top: auto; padding-top: 16px; }
.q .preco b { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.q .preco span { color: var(--c30-suave); font-size: 12.5px; }
.q .pe .btn { height: 40px; }
.q .pe { flex-wrap: wrap; }
.q .preco b { white-space: nowrap; }
.ficha .campos label small { color: var(--c30-suave); }
.q .pe .btn--borda { border-color: rgba(255, 255, 255, .3); background: transparent; color: #ffffff; }

/* ficha: a faixa branca */
.ficha-faixa { background: var(--azul); color: var(--nevoa); padding: clamp(44px, 6vw, 80px) 0; }
.ficha-faixa h2.titulo { color: var(--nevoa); }
.ficha-faixa .secao-cab p { color: var(--c30-suave); }
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; align-items: start; }
@media (max-width: 900px) { .ficha { grid-template-columns: 1fr; } }
.passos { list-style: none; margin: 0 0 22px; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; counter-reset: p; }
.passos li { counter-increment: p; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 6px; border-radius: 999px; background: rgba(255, 255, 255, .1); font-weight: 600; font-size: 13.5px; color: var(--c30-suave); }
.passos li::before { content: counter(p); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .08); font-size: 12px; font-weight: 700; color: var(--nevoa); }
.passos li.feito { background: var(--feito-fundo, rgba(255, 122, 26, .18)); color: var(--dourado); }
.passos li.feito::before { background: var(--dourado); color: var(--azul); }
.passos li.agora { background: var(--nevoa); color: var(--azul); }
.passos li.agora::before { background: var(--azul); color: var(--nevoa); }
.ficha form { display: grid; gap: 18px; }
.ficha .campos label { display: block; font-size: 13.5px; font-weight: 600; color: var(--nevoa); }
.ficha .campos label small { margin-left: 4px; }
.ficha .campos label > input, .ficha .campos label > textarea { margin-top: 7px; }
.ficha input:not([type="checkbox"]), .ficha textarea { height: 48px; font-size: 16px; }
.ficha textarea { height: auto; min-height: 90px; }
.ficha .enviar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ficha .enviar .btn--cheio { height: 50px; padding: 0 26px; font-size: 15.5px; }
.ficha .enviar small a { color: #fff; text-decoration-color: var(--laranja); text-decoration-thickness: 2px; }
.ficha .enviar small { color: var(--c30-suave); font-size: 13px; max-width: 30em; }
.resumo { position: sticky; top: 84px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
@media (max-width: 900px) { .resumo { position: static; order: -1; } }
.resumo h3 { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 22px; font-weight: 700; }
.resumo dl { margin: 0; display: grid; gap: 10px; }
.resumo dl div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.resumo dt { color: var(--c30-suave); }
.resumo dd { margin: 0; font-weight: 600; text-align: right; }
.resumo .total { border-top: 1px solid rgba(255, 255, 255, .18); padding-top: 12px; }
.resumo .total dd { font-family: var(--display); font-size: 26px; font-weight: 750; }
.resumo .mudar { justify-self: start; background: none; border: 0; padding: 0; color: var(--dourado); font-weight: 700; cursor: pointer; font-size: 13.5px; text-decoration: underline; }
.resumo .aviso { font-size: 13px; color: var(--c30-suave); background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 10px 12px; }
.espera { padding: 22px; border-radius: 16px; background: rgba(255, 255, 255, .08); color: var(--c30-suave); max-width: 36em; }

.feito-ok { display: grid; gap: 14px; max-width: 40em; }
.feito-ok .cod { font-family: var(--display); font-variation-settings: "wdth" 78; font-size: clamp(48px, 9vw, 96px); font-weight: 750; letter-spacing: -.03em; line-height: .9; color: var(--dourado); }
.feito-ok p { color: var(--c30-suave); font-size: 16px; }
@media (prefers-reduced-motion: no-preference) { .feito-ok { animation: aparece .35s ease-out; } @keyframes aparece { from { opacity: 0; transform: translateY(8px); } } }

/* fotos da pousada: capa grande à esquerda e as outras em mosaico; no celular, faixa que desliza */
.galeria { padding: 0 0 clamp(40px, 6vw, 72px); }
.mosaico { position: relative; display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 230px 230px; gap: 8px; border-radius: 20px; overflow: hidden; }
.mosaico .tile { padding: 0; border: 0; margin: 0; cursor: zoom-in; background: var(--c30-clara); overflow: hidden; min-width: 0; }
.mosaico .tile img { width: 100%; height: 100%; object-fit: cover; }
.mosaico .tile:first-child { grid-row: 1 / 3; }
.mosaico[data-n="1"] { grid-template-columns: 1fr; grid-template-rows: clamp(260px, 42vw, 480px); }
.mosaico[data-n="1"] .tile:first-child { grid-row: auto; }
.mosaico[data-n="2"] .tile:nth-child(2) { grid-column: 2 / 4; grid-row: 1 / 3; }
.mosaico[data-n="3"] .tile:nth-child(2), .mosaico[data-n="3"] .tile:nth-child(3) { grid-column: 2 / 4; }
.mosaico[data-n="4"] .tile:nth-child(2) { grid-column: 2 / 4; }
.mosaico .tile:focus-visible { outline: 3px solid var(--laranja); outline-offset: -3px; }
.ver-todas { position: absolute; right: 14px; bottom: 14px; height: 36px; padding: 0 14px; border-radius: 9px; border: 0; background: #fff; color: var(--marinho); font: 700 13px var(--f); cursor: pointer; box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .5); }
@media (max-width: 700px) {
  .mosaico, .mosaico[data-n] { grid-template-columns: none; grid-template-rows: 250px; grid-auto-flow: column; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; border-radius: 16px; }
  .mosaico .tile, .mosaico[data-n] .tile:nth-child(n) { grid-row: auto; grid-column: auto; scroll-snap-align: start; border-radius: 12px; }
  .mosaico[data-n="1"] { grid-auto-columns: 100%; }
  .ver-todas { display: none; }
}
.visor { width: min(1100px, 100vw); max-width: 100vw; height: min(86vh, 900px); max-height: 100vh; padding: 0; border: 0; background: transparent; overflow: visible; }
.visor::backdrop { background: rgba(8, 16, 32, .92); }
.visor img { width: 100%; height: calc(100% - 40px); object-fit: contain; }
.visor .conta { text-align: center; color: #fff; font-weight: 600; margin-top: 10px; }
.visor .vb { position: fixed; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; font-size: 30px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.visor .vb:hover { background: rgba(255, 255, 255, .26); }
.visor .fecha { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
.visor .ant { left: 14px; top: 50%; transform: translateY(-50%); }
.visor .prox { right: 14px; top: 50%; transform: translateY(-50%); }

/* bom saber */
.saber { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 1px solid var(--fio); }
.saber div { padding: 20px 24px 20px 0; border-bottom: 1px solid var(--fio); }
.saber dt { font-family: var(--display); font-variation-settings: "wdth" 85; font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.saber dd { margin: 0; color: var(--sobre-preto); white-space: pre-line; }
.rodape { padding: 30px 0 calc(30px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--fio); color: var(--sobre-preto); font-size: 13.5px; }
.rodape .dentro { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rodape a { color: var(--sobre-preto); }

.nao-achei { min-height: 70vh; display: grid; place-items: center; text-align: left; padding: 40px 20px; }
.nao-achei div { max-width: 30em; display: grid; gap: 14px; }
.nao-achei h1 { font-family: var(--display); font-size: 40px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
.nao-achei p { color: var(--sobre-preto); }
.carregando { min-height: 70vh; display: grid; place-items: center; color: var(--sobre-preto); }
.ficha .erro, .bilhete .erro { margin: 0; }

/* ---------- tema por pousada ----------
   Pousada Guará: cores do logo (placa de madeira escura, letras brancas, guará vermelho).
   Branco no fundo e vermelho vivo nas superfícies fortes, ~45% cada; marrom e preto (~10%) no texto e nos detalhes.
   Guarás em vetor, num vermelho mais escuro, voam na abertura e na ficha e um fica em pé nas ondas. */
:root[data-tema="guara"] {
  --g-vermelho: #ff2400; --g-vermelho-esc: #a8121c; --g-guara: #8a0f18; --g-marrom: #5a3b2c; --g-preto: #1d1512; --g-fundo-foto: #fdeced;
  --marinho: var(--g-vermelho); --azul: var(--g-vermelho); --laranja: #ffffff; --dourado: #ffffff;
  --gelo: #ffffff; --c60: #ffffff; --c60-texto: var(--g-preto); --tinta: var(--g-preto); --suave: #6b5a52;
  --c10: #ffffff; --c10-esc: #fde3e4; --c10-tinta: var(--g-vermelho); --c10-clara: rgba(255, 255, 255, .5);
  --c30-suave: rgba(255, 255, 255, .86); --c30-clara: var(--g-fundo-foto);
  --sobre-preto: rgba(29, 21, 18, .74); --fio: rgba(90, 59, 44, .2);
  --titulo: var(--g-vermelho); --risco: var(--g-marrom); --barra: #ffffff; --vazia: var(--g-vermelho);
  --claro-borda: rgba(255, 36, 0, .45); --sombra-bilhete: rgba(138, 15, 24, .7); --sombra-topo: rgba(29, 21, 18, .55); --sombra-q: rgba(138, 15, 24, .55);
  --escolhido: #ffffff; --anel: var(--g-preto); --pulso: rgba(29, 21, 18, .8);
  --situ-fundo: rgba(29, 21, 18, .6); --livre-fundo: var(--g-preto); --livre-tinta: #ffffff; --feito-fundo: rgba(255, 255, 255, .2);
  --onda-1: rgba(90, 59, 44, .22); --onda-2: rgba(90, 59, 44, .12); --onda-3: rgba(255, 36, 0, .55);
  --confete-1: var(--g-preto); --confete-3: var(--g-marrom);
}
[data-tema="guara"] :focus-visible { outline-color: var(--g-preto); }
[data-tema="guara"] .btn--claro:hover { border-color: var(--g-vermelho); }
[data-tema="guara"] .btn--cheio { box-shadow: 0 6px 16px -10px rgba(29, 21, 18, .55); }
[data-tema="guara"] .rodape { background: var(--g-preto); color: rgba(255, 255, 255, .78); border-top: 0; }
[data-tema="guara"] .rodape a { color: rgba(255, 255, 255, .78); }
.guara { display: block; fill: var(--g-guara); stroke: var(--g-guara); overflow: visible; }
.guara .tr { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.guara .olho { fill: #fff; stroke: none; }
.bando { position: absolute; pointer-events: none; z-index: 0; }
.bando > span { position: absolute; display: block; }
.bando--topo { top: clamp(12px, 3vw, 40px); right: max(20px, calc((100% - 1160px) / 2 + 40px)); width: 330px; height: 170px; }
.bando--topo > span:nth-child(1) { width: 92px; left: 30px; top: 46px; }
.bando--topo > span:nth-child(2) { width: 64px; left: 150px; top: 10px; }
.bando--topo > span:nth-child(3) { width: 50px; left: 228px; top: 70px; }
.bando--ficha { right: max(20px, calc((100% - 1160px) / 2)); bottom: clamp(16px, 3vw, 36px); width: 260px; height: 120px; }
.bando--ficha .guara { fill: rgba(110, 8, 16, .85); stroke: rgba(110, 8, 16, .85); }
.bando--ficha > span:nth-child(1) { width: 78px; left: 20px; top: 40px; }
.bando--ficha > span:nth-child(2) { width: 54px; left: 130px; top: 6px; }
.bando--ficha > span:nth-child(3) { width: 42px; left: 196px; top: 62px; }
.ficha-faixa .dentro, .abertura .dentro { position: relative; z-index: 1; }
.guara-agua { position: absolute; right: max(18px, 7vw); bottom: clamp(4px, 1.4vw, 18px); width: clamp(54px, 6vw, 84px); z-index: 0; pointer-events: none; }
.guara-cab { width: 86px; align-self: center; }
[data-tema="guara"] .topo .marca i { padding: 3px; background: var(--g-preto); }
[data-tema="guara"] .topo .marca i .guara { width: 100%; height: 100%; fill: var(--g-vermelho); stroke: var(--g-vermelho); }
@media (max-width: 920px) {
  .bando--topo { top: 6px; right: 8px; width: 200px; height: 100px; scale: .62; transform-origin: top right; }

}
@media (max-width: 700px) { .bando--ficha { display: none; } }
@media (max-width: 560px) { .guara-cab { width: 64px; } }

/* ---------- movimento ----------
   Tudo tem tema de mar: o nome sobe da linha d'água letra por letra, um traço de onda laranja se desenha embaixo,
   os números contam, o bilhete desliza para a mão e o barquinho navega entre as datas. As ondas do fundo correm sem parar.
   Os estados escondidos só existem com a classe .anima, que o script só põe quando o sistema não pede menos movimento. */
:root { --e-sai: cubic-bezier(.16, 1, .3, 1); --e-mola: cubic-bezier(.34, 1.56, .64, 1); }
.topo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--barra, var(--laranja)); transform-origin: left; transform: scaleX(var(--rol, 0)); }
.topo { transition: box-shadow .4s; }
.topo.rolou { box-shadow: 0 10px 30px -18px var(--sombra-topo, rgba(19, 41, 75, .8)); }
.abertura { position: relative; overflow: hidden; padding-bottom: clamp(70px, 10vw, 130px); }
.abertura .dentro { position: relative; z-index: 1; }
.mar { position: absolute; left: 0; right: 0; bottom: 0; height: clamp(60px, 9vw, 120px); overflow: hidden; pointer-events: none; z-index: 0; }
.mar svg, .ondas-topo svg { position: absolute; left: 0; top: 0; width: 200%; height: 100%; }
.mar path { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke: var(--onda-1, rgba(19, 41, 75, .14)); }
.mar svg:nth-child(2) path { stroke: var(--onda-2, rgba(19, 41, 75, .09)); }
.mar svg:nth-child(3) path { stroke: var(--onda-3, rgba(255, 122, 26, .5)); }
.ficha-faixa { position: relative; }
.ondas-topo { position: absolute; left: 0; right: 0; bottom: calc(100% - 1px); height: clamp(26px, 4vw, 46px); overflow: hidden; pointer-events: none; }
.ondas-topo path { fill: var(--azul); }
.ondas-topo svg + svg path { opacity: .3; }
h1.nome .pal { display: inline-block; }
h1.nome .le { display: inline-block; transform-origin: 0 100%; }
/* logo do guará: "Pousada" em cima, GUARÁ embaixo, com o U trocado por uma meia-lua com o guará dentro */
.guara-lockup { display: inline-flex; flex-direction: column; align-items: flex-start; font-weight: 400; line-height: .9; }
.guara-lockup .lk-p { font-family: var(--display); font-weight: 800; font-variation-settings: "wdth" 80, "opsz" 96; font-size: .36em; letter-spacing: .01em; margin-bottom: .06em; }
.guara-lockup .lk-g { font-family: "Federo", var(--display), serif; font-size: 1em; letter-spacing: .06em; white-space: nowrap; display: inline-flex; align-items: baseline; }
.guara-u { display: inline-block; width: .8em; height: .8em; margin: 0 .02em; overflow: visible; vertical-align: baseline; fill: currentColor; stroke: none; }
.guara-u path { fill: currentColor; stroke: none; }
.guara-u .tr { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.guara-u .olho { fill: #fff; stroke: none; }
.risco { display: block; width: min(340px, 62%); height: auto; margin: -8px 0 20px; color: var(--risco, var(--laranja)); overflow: visible; }
.risco path { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; }
.fatos { position: relative; }
.fatos dd { font-variant-numeric: tabular-nums; }
.contador output { display: inline-block; }
.bilhete .parte + .parte { position: relative; }
.bilhete .rota .barco svg { transform-origin: 50% 80%; }
.masc { display: inline-block; }
.masc > span { display: inline-block; transform-origin: 0 100%; }
.saber div { position: relative; }
.q { position: relative; transition: transform .6s var(--e-sai), box-shadow .6s var(--e-sai); }
.q::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, .16), transparent 50%); }
.q .f img, .mosaico .tile img { transition: scale 1s var(--e-sai); }
.feito-ok { scroll-margin-top: 90px; }
.feito-ok .cod { justify-self: start; position: relative; display: inline-block; }
.confete { position: absolute; left: 50%; top: 50%; pointer-events: none; }
.confete i { position: absolute; width: 8px; height: 14px; border-radius: 2px; opacity: 0; }
.btn--cheio { position: relative; overflow: hidden; isolation: isolate; }
.btn--cheio::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); translate: -150% 0; pointer-events: none; }
.btn { transition: translate .3s var(--e-sai), scale .2s, border-color .2s, background-color .2s; }

@media (prefers-reduced-motion: no-preference) {
  @keyframes m-desce { from { translate: 0 -100%; } }
  @keyframes m-sobe { from { opacity: 0; translate: 0 28px; } }
  @keyframes m-sobe-p { from { opacity: 0; translate: 0 8px; } }
  @keyframes m-esq { from { opacity: 0; translate: -16px 0; } }
  @keyframes m-letra { from { opacity: 0; translate: 0 105%; rotate: 8deg; } }
  @keyframes m-pino { 0% { opacity: 0; translate: 0 -18px; } 60% { opacity: 1; translate: 0 2px; } 100% { translate: 0 0; } }
  @keyframes m-traco { from { stroke-dashoffset: 1; } }
  @keyframes m-linha { from { scale: 0 1; } }
  @keyframes m-picote { to { scale: 0 1; } }
  @keyframes m-bilhete { from { opacity: 0; translate: 80px 24px; rotate: 6deg; } }
  @keyframes m-barco-entra { from { opacity: 0; translate: -50px 0; } }
  @keyframes m-boia { 0%, 100% { rotate: -6deg; translate: 0 1px; } 50% { rotate: 6deg; translate: 0 -2px; } }
  @keyframes m-navega { 0% { translate: 0 0; } 35% { translate: 16px -3px; rotate: 10deg; opacity: 1; } 45% { translate: 24px -3px; opacity: 0; } 55% { translate: -24px 0; opacity: 0; rotate: 0deg; } 100% { translate: 0 0; opacity: 1; } }
  @keyframes m-onda { to { translate: -50% 0; } }
  @keyframes m-pula-c { from { opacity: 0; translate: 0 70%; } }
  @keyframes m-pula-b { from { opacity: 0; translate: 0 -70%; } }
  @keyframes m-pop { 0% { opacity: 0; scale: .3; } 70% { opacity: 1; scale: 1.12; } 100% { scale: 1; } }
  @keyframes m-corte { from { clip-path: inset(0 100% 0 0); } }
  @keyframes m-zoom { from { scale: 1.25; } }
  @keyframes m-cartao { from { opacity: 0; translate: 0 56px; rotate: 2.5deg; scale: .96; } }
  @keyframes m-pulso { 0% { box-shadow: 0 0 0 4px var(--pulso, rgba(255, 122, 26, .9)); } 100% { box-shadow: 0 0 0 26px transparent; } }
  @keyframes m-carimbo { 0% { opacity: 0; scale: 2.8; rotate: -16deg; filter: blur(6px); } 55% { opacity: 1; scale: .92; rotate: -3deg; filter: blur(0); } 75% { scale: 1.04; } 100% { scale: 1; rotate: -3deg; } }
  @keyframes m-confete { 0% { opacity: 1; translate: 0 0; rotate: 0deg; } 55% { opacity: 1; translate: var(--x) var(--y); } 100% { opacity: 0; translate: calc(var(--x) * 1.25) calc(var(--y) + 120px); rotate: var(--r); } }
  @keyframes m-brilho { to { translate: 260% 0; } }
  @keyframes m-busca { to { background-position: 28.28px 0; } }
  @keyframes m-respira { 50% { opacity: .45; } }

  .carregando { animation: m-respira 1.4s ease-in-out infinite; }
  @keyframes m-asa { to { transform: scaleY(-.6); } }
  @keyframes m-paira { 0%, 100% { translate: 0 0; } 50% { translate: -6px -9px; } }
  @keyframes m-chega { from { opacity: 0; translate: 140px -50px; } }
  @keyframes m-bica { 0%, 78%, 100% { transform: rotate(0deg); } 84%, 90% { transform: rotate(28deg); } 87% { transform: rotate(24deg); } }
  .anima .guara .asa { transform-box: view-box; transform-origin: 50px 30px; animation: m-asa var(--bate, .55s) ease-in-out infinite alternate; }
  .anima .bando > span { animation: m-chega 2.4s var(--e-sai) var(--chega, .6s) both; }
  .anima .bando > span > .guara { animation: m-paira var(--paira, 6s) ease-in-out infinite; }
  .anima .bando > span:nth-child(2) { --chega: .8s; --bate: .48s; --paira: 7s; }
  .anima .bando > span:nth-child(3) { --chega: 1s; --bate: .62s; --paira: 5.2s; }
  .anima .guara-agua .cabeca { transform-box: view-box; transform-origin: 42px 44px; animation: m-bica 7s ease-in-out 3s infinite; }
  .anima .mar svg { animation: m-onda 26s linear infinite; }
  .anima .mar svg:nth-child(2) { animation-duration: 18s; animation-direction: reverse; }
  .anima .mar svg:nth-child(3) { animation-duration: 34s; }
  .anima .ondas-topo svg { animation: m-onda 16s linear infinite; }
  .anima .ondas-topo svg + svg { animation-duration: 24s; animation-direction: reverse; }

  /* abertura: uma sequência só, de cima para baixo */
  .anima .topo { animation: m-desce .8s var(--e-sai) both; }
  .anima .onde { animation: m-esq .8s var(--e-sai) .15s both; }
  .anima .onde svg { animation: m-pino .8s var(--e-mola) .3s both; }
  .anima h1.nome .pal { clip-path: inset(-.4em -.2em -.06em -.2em); }
  .anima h1.nome.pronto .pal { clip-path: none; }
  .anima h1.nome .le { animation: m-letra 1s var(--e-sai) calc(.3s + var(--i) * .04s) both; }
  .anima .risco path { animation: m-traco 1.2s var(--e-sai) calc(.6s + var(--n, 10) * .04s) both; }
  .anima .sobre { animation: m-sobe .9s var(--e-sai) calc(.5s + var(--n, 10) * .04s) both; }
  .anima .fatos { border-top-color: transparent; }
  .anima .fatos::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px; background: var(--fio); transform-origin: left; animation: m-linha 1.4s var(--e-sai) calc(.6s + var(--n, 10) * .04s) both; }
  .anima .fatos div { animation: m-sobe .8s var(--e-sai) calc(.7s + var(--n, 10) * .04s + var(--k, 0) * .09s) both; }
  .fatos div:nth-child(2) { --k: 1; } .fatos div:nth-child(3) { --k: 2; } .fatos div:nth-child(4) { --k: 3; }
  .anima .contato { animation: m-sobe .8s var(--e-sai) calc(1s + var(--n, 10) * .04s) both; }
  .anima .bilhete { animation: m-bilhete 1.2s var(--e-sai) .35s both; }
  .anima .bilhete .parte + .parte::before { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 2px; background: var(--azul); transform-origin: right; animation: m-picote 1s var(--e-sai) 1.15s both; }
  .anima .bilhete .rota .barco { animation: m-barco-entra 1.1s var(--e-sai) 1.25s both; }
  .anima .bilhete .rota .barco svg { animation: m-boia 3.2s ease-in-out 2.3s infinite; }
  .anima .bilhete .rota .barco.navega { animation: m-navega 1.1s var(--e-sai) both; }
  .anima .contador output.pula-c { animation: m-pula-c .35s var(--e-sai); }
  .anima .contador output.pula-b { animation: m-pula-b .35s var(--e-sai); }
  .anima .bilhete .noites.troca { animation: m-sobe-p .5s var(--e-sai); }
  .btn.procurando { background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .22) 0 10px, transparent 10px 20px); background-size: 28.28px 28.28px; animation: m-busca .6s linear infinite; opacity: 1 !important; }

  /* o que aparece ao rolar */
  .anima .rv:not(.rv-on) { opacity: 0; }
  .anima .rv.rv-on { animation: m-sobe .9s var(--e-sai) var(--d, 0s) both; }
  .anima .rv-corte.rv-on { animation: m-corte 1.2s var(--e-sai) var(--d, 0s) both; }
  .anima .rv-corte.rv-on img { animation: m-zoom 1.8s var(--e-sai) var(--d, 0s) both; }
  .anima .rv-cartao.rv-on { animation: m-cartao 1s var(--e-sai) var(--d, 0s) both; }
  .anima .rv-cartao.rv-on .situ.livre { animation: m-pop .6s var(--e-mola) calc(var(--d, 0s) + .45s) both; }
  .anima .rv-titulo.rv-on { animation: none; }
  .anima .rv-titulo.rv-on:not(.rv-fim) .masc { clip-path: inset(-.4em -.2em -.04em -.2em); }
  .anima .rv-titulo.rv-on .masc > span { animation: m-letra 1.1s var(--e-sai) var(--d, 0s) both; }
  .anima .rv-fim, .anima .rv-fim.rv-corte img, .anima .rv-fim .masc > span { animation: none; }
  .anima .saber div { border-bottom-color: transparent; }
  .anima .saber div::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--fio); transform-origin: left; scale: 0 1; transition: scale 1.4s var(--e-sai) var(--d, 0s); }
  .anima .saber div.rv-on::after { scale: 1 1; }
  .anima .passos li.agora { animation: m-pop .6s var(--e-mola) .3s both; }
  .anima .q.pulsa { animation: m-pulso .9s ease-out 2; }
  .anima .feito-ok .cod { animation: m-carimbo .9s var(--e-sai) .25s both; }
  .anima .confete i { animation: m-confete 1.6s cubic-bezier(.2, .7, .3, 1) calc(.5s + var(--t, 0s)) both; }

  /* mão em cima */
  .btn--cheio:hover::after { animation: m-brilho .9s var(--e-sai); }
  .btn:hover { translate: 0 -1px; }
  .btn:active { scale: .97; translate: 0 0; }
  .mosaico .tile:hover img { scale: 1.05; }
  @media (hover: hover) and (pointer: fine) {
    .q:hover { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-6px); box-shadow: 0 30px 44px -26px var(--sombra-q, rgba(19, 41, 75, .65)); }
    .q.escolhido:hover { box-shadow: 0 0 0 4px var(--anel, rgba(255, 122, 26, .45)), 0 30px 44px -26px var(--sombra-q, rgba(19, 41, 75, .65)); }
    .q:hover::after { opacity: 1; }
    .q:hover .f img { scale: 1.06; }
  }
}

<body>
<div id="raiz"><p class="carregando">Carregando a pousada…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const { sb, esc, brl, hoje, addDias, noites, dmy, errText } = PG;
  const $ = id => document.getElementById(id);
  const raiz = $("raiz");
  const slug = new URLSearchParams(location.search).get("p") || "";
  const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const dia = d => { const t = new Date(d + "T12:00:00Z"); return `${SEM[t.getUTCDay()]}, ${t.getUTCDate()} de ${MES[t.getUTCMonth()]}`; };
  const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
  const iniciais = s => String(s || "?").trim().split(/\s+/).filter(w => w.length > 2 || /^[A-Z]/.test(w)).slice(-2).map(w => w[0]).join("").toUpperCase() || "P";
  const ICONE_LOCAL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  const ICONE_BARCO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0 3-1.3 4.5 0"/><path d="M5 14l-1-4h16l-2 4M12 10V4l5 6"/></svg>';
  const naoAchei = (t, p) => { raiz.innerHTML = `<main class="nao-achei"><div><h1>${t}</h1><p>${p}</p></div></main>`; document.title = t; };

  if (!/^[a-z0-9-]{3,40}$/.test(slug)) return naoAchei("Endereço incompleto", "O link da pousada precisa terminar com ?p= e o nome dela. Peça o link certo para a pousada.");
  const { data: P, error: eP } = await sb.rpc("site_pousada", { p_slug: slug });
  if (eP) return naoAchei("Não deu para abrir a pousada", errText(eP) + " Recarregue a página.");
  if (!P) return naoAchei("Pousada não encontrada", "Esse link não leva a nenhuma pousada. Confira se ele foi copiado inteiro.");
  const Q = (P.quartos || []).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { numeric: true }));

  const lugar = [P.bairro, P.cidade].filter(Boolean).join(", ");
  const zap = (() => { let d = String(P.whatsapp || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d.length >= 12 ? d : ""; })();
  const linkZap = msg => `https://wa.me/${zap}?text=${encodeURIComponent(msg)}`;
  document.title = `${P.nome}${P.cidade ? ", " + P.cidade : ""}`;
  document.querySelector('meta[name="description"]').content = P.descricao ? P.descricao.slice(0, 150) : `Quartos da ${P.nome}${lugar ? " em " + lugar : ""}. Veja os quartos livres e peça sua reserva.`;

  // tema de cores próprio de cada pousada (as outras ficam com o marinho e laranja padrão)
  const TEMAS = { "pousada-exemplo": { tema: "guara", cor: "#ff2400" } };
  const GUARAS = TEMAS[slug] && TEMAS[slug].tema === "guara";
  if (TEMAS[slug]) { document.documentElement.dataset.tema = TEMAS[slug].tema; document.querySelector('meta[name="theme-color"]').content = TEMAS[slug].cor; }
  const S = { entrada: hoje(), saida: addDias(hoje(), 1), adultos: 2, criancas: 0, livres: null, buscando: false, quarto: null, enviado: null, buscaN: 0 };

  /* ---------- peças do movimento ---------- */
  const MOV = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.documentElement.classList.toggle("anima", MOV);
  // o nome vira letras soltas (para subirem uma a uma); o leitor de tela continua lendo o nome inteiro pelo aria-label
  let nLetras = 0;
  const letreiro = s => String(s).trim().split(/\s+/).map(w => `<span class="pal">${Array.from(w).map(c => `<span class="le" style="--i:${nLetras++}">${esc(c)}</span>`).join("")}</span>`).join(" ");
  // onda que se repete a cada "per" unidades, num desenho de 2400 de largura (o dobro da tela), para correr em loop sem emenda
  const onda = (y, amp, per) => { let d = `M0 ${y}`; for (let x = 0; x < 2400; x += per) d += ` Q${x + per / 4} ${y - amp} ${x + per / 2} ${y} T${x + per} ${y}`; return d; };
  const svgOnda = (h, d, extra = "") => `<svg viewBox="0 0 2400 ${h}" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="${d}" ${extra}/></svg>`;
  const MAR = `<div class="mar" aria-hidden="true">${svgOnda(120, onda(40, 14, 400))}${svgOnda(120, onda(64, 10, 300))}${svgOnda(120, onda(86, 8, 600))}</div>`;
  const ONDAS_TOPO = `<div class="ondas-topo" aria-hidden="true">${svgOnda(50, onda(24, 12, 600) + " L2400 50 L0 50 Z")}${svgOnda(50, onda(18, 10, 400) + " L2400 50 L0 50 Z")}</div>`;
  // guarás em vetor: em pé (de lado, olhando para a esquerda) e voando (asa anima batendo)
  const GUARA_PE = `<svg class="guara" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M38 40 C44 31 62 31 74 39 L86 44 C77 46 72 50 66 54 C56 58 43 55 38 40 Z"/>
    <path class="tr" stroke-width="2.4" d="M54 55 L52 73 L55 92 M61 55 L63 73 L60 92 M55 92 L48 93 M60 92 L67 93"/>
    <g class="cabeca"><path class="tr" stroke-width="7" d="M42 44 C34 35 37 27 31 19"/><circle cx="30.5" cy="17" r="5.6"/>
    <path class="tr" stroke-width="2.8" d="M26 16 C18 18 12 24 8 34"/><circle class="olho" cx="29.6" cy="15.6" r="1.1"/></g></svg>`;
  // o U de GUARÁ: meia-lua com o guará dentro (mesmo desenho do ícone, em tinta da letra)
  const GUARA_U = `<svg class="guara-u" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M14.3 29 A38 38 0 0 0 85.7 29 A35.7 35.7 0 0 1 14.3 29 Z"/>
    <g transform="translate(24 4) scale(.6)">
    <path d="M38 40 C44 31 62 31 74 39 L86 44 C77 46 72 50 66 54 C56 58 43 55 38 40 Z"/>
    <path class="tr" stroke-width="2.4" d="M54 55 L52 73 L55 92 M61 55 L63 73 L60 92 M55 92 L48 93 M60 92 L67 93"/>

      $("ok").focus(); return;
    }
    const q = S.quarto && Q.find(x => x.id === S.quarto), livre = q && S.livres.get(q.id), n = noites(S.entrada, S.saida);
    const passo = !S.livres ? 1 : !q ? 2 : 3;
    const passos = `<ol class="passos" aria-label="Etapas do pedido">${["Datas", "Quarto", "Seus dados"].map((t, i) => `<li class="${i + 1 < passo ? "feito" : i + 1 === passo ? "agora" : ""}" ${i + 1 === passo ? 'aria-current="step"' : ""}>${t}</li>`).join("")}</ol>`;
    const cab = `<div class="secao-cab"><div><h2 class="titulo">Sua ficha</h2></div><p>Preencha uma vez e a pousada já recebe tudo. Quem estiver no balcão também pode preencher aqui na chegada.</p></div>`;
    const entra = () => { mascara(box.querySelector("h2.titulo")); revela([box.querySelector("h2.titulo")], 0, "rv-titulo"); revela([box.querySelector(".secao-cab p"), box.querySelector(".passos"), ...box.querySelectorAll(".espera, .ficha .campos label, .ficha .enviar, .resumo")], .07); };
    if (!q) { box.innerHTML = cab + passos + `<p class="espera">${passo === 1 ? "Escolha as datas no bilhete lá em cima e toque em Ver quartos livres." : "Escolha um quarto livre na lista acima. A ficha abre aqui."}</p>`; entra(); return; }
    box.innerHTML = cab + passos + `<div class="ficha">
      <form id="f-ficha" novalidate><div class="campos">
        <label class="todo">Nome completo<input id="f-nome" maxlength="100" autocomplete="name" required></label>
        <label>WhatsApp com DDD<input id="f-tel" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="(41) 99999-0000" required></label>
        <label>CPF ou documento <small>opcional</small><input id="f-doc" maxlength="30" inputmode="numeric" autocomplete="off"></label>
        <label class="todo">Email <small>opcional</small><input id="f-email" type="email" inputmode="email" maxlength="120" autocomplete="email"></label>
        <label class="todo">Recado para a pousada <small>opcional: horário de chegada, se vem de barco. Não coloque dados de saúde.</small><textarea id="f-obs" maxlength="500"></textarea></label></div>
        <p class="erro" id="f-erro" role="alert" hidden></p>
        <div class="enviar"><button class="btn btn--cheio" type="submit" id="f-enviar">Enviar pedido</button><small>Você ainda não paga nada. A pousada confirma ${zap ? "pelo WhatsApp" : "pelo telefone"}. Ao enviar, você confirma que tem 18 anos ou mais e que leu o <a href="privacidade.html?p=${encodeURIComponent(slug)}" target="_blank" rel="noopener">Aviso de Privacidade</a>.</small></div>
      </form>
      <aside class="resumo" aria-label="Resumo do pedido"><h3>${esc(q.nome)}</h3>
        <dl><div><dt>Entrada</dt><dd>${dia(S.entrada)}, a partir das ${esc(P.checkin_hora)}</dd></div><div><dt>Saída</dt><dd>${dia(S.saida)}, até as ${esc(P.checkout_hora)}</dd></div>
        <div><dt>Pessoas</dt><dd>${plural(S.adultos, "adulto", "adultos")}${S.criancas ? ` e ${plural(S.criancas, "criança", "crianças")}` : ""}</dd></div>
        <div class="total"><dt>${plural(n, "noite", "noites")}</dt><dd>${brl(livre.total)}</dd></div></dl>
        ${P.sinal_percentual ? `<p class="aviso">A pousada pede sinal de ${P.sinal_percentual}% para confirmar.</p>` : ""}
        <button class="mudar" type="button" data-mudar>Trocar quarto ou datas</button></aside></div>`;
    entra();
    document.querySelector("[data-mudar]").onclick = () => $("quartos").scrollIntoView({ behavior: "smooth" });
    $("f-ficha").addEventListener("input", () => { $("f-erro").hidden = true; });
    $("f-ficha").addEventListener("submit", async e => {
      e.preventDefault(); const err = $("f-erro"); err.hidden = true;
      const d = { nome: $("f-nome").value.trim(), tel: $("f-tel").value.trim(), doc: $("f-doc").value.trim(), email: $("f-email").value.trim(), obs: $("f-obs").value.trim() };
      const dig = d.tel.replace(/\D/g, "");
      const falha = d.nome.length < 2 ? "Escreva seu nome completo." : dig.length < 10 || dig.length > 13 ? "Coloque o WhatsApp com DDD, por exemplo (41) 99999-0000." : d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email) ? "Esse email não parece completo. Confira ou deixe em branco." : "";
      if (falha) { err.textContent = falha; err.hidden = false; return; }
      const btn = $("f-enviar"); btn.disabled = true; btn.textContent = "Enviando pedido…";
      const { data, error } = await sb.rpc("pedir_estadia", { p_slug: slug, p_quarto: q.id, p_entrada: S.entrada, p_saida: S.saida, p_adultos: S.adultos, p_criancas: S.criancas, p_nome: d.nome, p_telefone: d.tel, p_documento: d.doc, p_email: d.email, p_obs: d.obs });
      if (error) { btn.disabled = false; btn.textContent = "Enviar pedido"; err.textContent = errText(error); err.hidden = false; return; }
      S.enviado = { cod: "#" + String(data).padStart(5, "0"), quarto: q.id, entrada: S.entrada, saida: S.saida, pessoas: pessoas(), nome: d.nome };
      desenhaFicha();
    });
  }

  // visor de fotos em tela cheia
  const FOTOS = (P.fotos || []).filter(u => /^https:\/\//.test(u)); let fotoAtual = 0;
  const mostraFoto = i => { fotoAtual = (i + FOTOS.length) % FOTOS.length; $("visor-img").src = FOTOS[fotoAtual]; $("visor-img").alt = `Foto ${fotoAtual + 1} da ${P.nome}`; $("visor-conta").textContent = `${fotoAtual + 1} de ${FOTOS.length}`; };
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-foto]"); if (t && $("visor")) { mostraFoto(Number(t.dataset.foto)); $("visor").showModal(); return; }
    const v = e.target.closest("[data-visor]"); if (v) { if (v.dataset.visor === "fechar") $("visor").close(); else mostraFoto(fotoAtual + Number(v.dataset.visor)); return; }
    if (e.target.id === "visor") $("visor").close();
  });
  document.addEventListener("keydown", e => { const d = $("visor"); if (!d || !d.open) return; if (e.key === "ArrowRight") mostraFoto(fotoAtual + 1); if (e.key === "ArrowLeft") mostraFoto(fotoAtual - 1); });

  atualizaBilhete(); desenhaQuartos(); desenhaFicha();
  if (location.hash && location.hash !== "#inicio") { const alvo = document.querySelector(location.hash); if (alvo) alvo.scrollIntoView(); }
})();
</script>
</body>
</html>
